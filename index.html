<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>フードパントリー ポイント（試作）｜地域連携教育推進センター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- センター名を入れる（タスク21、ヒアリング⑦の 1-18-c） -->
  <p class="org-name">地域連携教育推進センター</p>
  <h1>フードパントリー ポイント（試作）</h1>

  <section class="balance-card" aria-labelledby="balance-heading">
    <div class="balance-inner">
      <h2 id="balance-heading">残り</h2>
      <p class="balance-line" aria-live="polite"><strong id="balance">0</strong> ポイント</p>
    </div>
  </section>

  <p id="message" role="status"></p>

  <section aria-labelledby="ranks-heading">
    <h2 id="ranks-heading">ポイントを使う</h2>
    <div id="ranks"></div>
  </section>

  <section aria-labelledby="history-heading">
    <h2 id="history-heading">履歴</h2>
    <ul id="history"></ul>
    <button type="button" id="history-toggle" hidden></button>
  </section>

  <footer class="credit">
    <p><button type="button" id="welcome-open" class="link-button">使い方をもう一度見る</button></p>
    <p>制作：yass</p>
  </footer>

  <!-- 初めて開いたときだけ出す説明（ようこそ画面、タスク19）。左右のスワイプ、下の点、「次へ」で進む -->
  <div id="welcome" class="welcome" role="dialog" aria-modal="true" aria-labelledby="welcome-title" hidden>
    <div class="welcome-panel">
      <div class="welcome-stripe"></div>
      <div class="welcome-slides" id="welcome-slides">
        <section class="welcome-slide" aria-label="1枚目（3枚中）">
          <div class="welcome-art" aria-hidden="true">
            <!-- 17色の長方形を、まん中から外へ、長さをばらばらにして並べる（生徒Kの案。SDGs の公式マークとは違う形、D-41） -->
            <svg class="welcome-burst" viewBox="-60 -60 120 120" width="120" height="120">
              <rect x="-4" y="-54" width="8" height="22" fill="#E5243B" transform="rotate(0.00)"/>
              <rect x="-4" y="-44" width="8" height="12" fill="#DDA63A" transform="rotate(21.18)"/>
              <rect x="-4" y="-49" width="8" height="17" fill="#4C9F38" transform="rotate(42.35)"/>
              <rect x="-4" y="-41" width="8" height="9" fill="#C5192D" transform="rotate(63.53)"/>
              <rect x="-4" y="-52" width="8" height="20" fill="#FF3A21" transform="rotate(84.71)"/>
              <rect x="-4" y="-46" width="8" height="14" fill="#26BDE2" transform="rotate(105.88)"/>
              <rect x="-4" y="-48" width="8" height="16" fill="#FCC30B" transform="rotate(127.06)"/>
              <rect x="-4" y="-56" width="8" height="24" fill="#A21942" transform="rotate(148.24)"/>
              <rect x="-4" y="-42" width="8" height="10" fill="#FD6925" transform="rotate(169.41)"/>
              <rect x="-4" y="-51" width="8" height="19" fill="#DD1367" transform="rotate(190.59)"/>
              <rect x="-4" y="-45" width="8" height="13" fill="#FD9D24" transform="rotate(211.76)"/>
              <rect x="-4" y="-50" width="8" height="18" fill="#BF8B2E" transform="rotate(232.94)"/>
              <rect x="-4" y="-43" width="8" height="11" fill="#3F7E44" transform="rotate(254.12)"/>
              <rect x="-4" y="-55" width="8" height="23" fill="#0A97D9" transform="rotate(275.29)"/>
              <rect x="-4" y="-47" width="8" height="15" fill="#56C02B" transform="rotate(296.47)"/>
              <rect x="-4" y="-49" width="8" height="17" fill="#00689D" transform="rotate(317.65)"/>
              <rect x="-4" y="-44" width="8" height="12" fill="#19486A" transform="rotate(338.82)"/>
              <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#712B13">ようこそ</text>
            </svg>
          </div>
          <h2 id="welcome-title">ようこそ</h2>
          <p>地域連携教育推進センター<br>フードパントリーのポイントです。</p>
        </section>
        <section class="welcome-slide" aria-label="2枚目（3枚中）">
          <div class="welcome-art" aria-hidden="true">
            <svg viewBox="0 0 64 64" width="88" height="88">
              <rect x="6" y="6" width="18" height="18" rx="2" fill="none" stroke="#712B13" stroke-width="4"/>
              <rect x="40" y="6" width="18" height="18" rx="2" fill="none" stroke="#712B13" stroke-width="4"/>
              <rect x="6" y="40" width="18" height="18" rx="2" fill="none" stroke="#712B13" stroke-width="4"/>
              <rect x="12" y="12" width="6" height="6" fill="#712B13"/>
              <rect x="46" y="12" width="6" height="6" fill="#712B13"/>
              <rect x="12" y="46" width="6" height="6" fill="#712B13"/>
              <rect x="34" y="34" width="8" height="8" fill="#26BDE2"/>
              <rect x="46" y="38" width="8" height="8" fill="#4C9F38"/>
              <rect x="38" y="50" width="8" height="8" fill="#FCC30B"/>
              <rect x="50" y="50" width="8" height="8" fill="#E5243B"/>
            </svg>
          </div>
          <h2>ポイントをもらう</h2>
          <p>活動の場所に貼ってあるQRコードを、<br>スマホのカメラで読むと、<br>ポイントがもらえます。</p>
        </section>
        <section class="welcome-slide" aria-label="3枚目（3枚中）">
          <div class="welcome-art" aria-hidden="true"><span class="welcome-sample-button">100ポイント</span></div>
          <h2>ポイントを使う</h2>
          <p>食品に書いてある点数と<br>同じボタンを押すと、交換できます。<br>残りと履歴は、このスマホに記録されます。</p>
        </section>
      </div>
      <div class="welcome-dots" id="welcome-dots">
        <button type="button" class="welcome-dot" aria-label="1枚目を見る"></button>
        <button type="button" class="welcome-dot" aria-label="2枚目を見る"></button>
        <button type="button" class="welcome-dot" aria-label="3枚目を見る"></button>
      </div>
      <div class="welcome-bar">
        <button type="button" id="welcome-skip" class="welcome-skip">スキップ</button>
        <button type="button" id="welcome-next" class="welcome-next">次へ</button>
      </div>
    </div>
  </div>

  <script src="rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
