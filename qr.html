<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>掲示用QRコード（職員用）｜地域連携教育推進センター</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 掲示用QRコードのページだけで使う見た目（タスク12） */
    .qr-card {
      margin: 16px 0;
      padding: 16px;
      border: 2px solid #1a1a1a;
      border-radius: 8px;
      text-align: center;
    }
    /* QRのまわりの17色の光（案B）。光の枠の中央の半分の大きさにQRを置く */
    .qr-ring {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
    }
    .qr-ring .qr-burst {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .qr-ring .qr-image {
      position: absolute;
      left: 25%;
      top: 25%;
      width: 50%;
      height: 50%;
    }
    .qr-card .qr-image svg {
      display: block;
      width: 100%;
      height: auto;
    }
    .qr-card .qr-name { font-size: 1.6rem; font-weight: bold; margin: 8px 0 0; }
    .qr-card .qr-points { font-size: 1.3rem; margin: 0; }
    .qr-card .qr-org { margin: 8px 0 0; font-size: 0.85rem; color: #5f5d59; }
    .qr-card .qr-url { font-size: 0.8rem; color: #444444; word-break: break-all; margin: 8px 0 0; }
    #print-button {
      min-height: 48px;
      padding: 8px 16px;
      font: inherit;
      color: #1a1a1a;
      background: #f2f2f2;
      border: 2px solid #333333;
      border-radius: 8px;
    }
    #print-button:focus-visible { outline: 3px solid #0050b3; outline-offset: 2px; }

    /* 印刷するときは、説明とボタンを消して、A4 1枚に4つ（縦2×横2、1つはA6＝はがきくらい）並べる。
       棚が大きくないので、A4 の1/4 の大きさにした（生徒K、2026-11-26）。
       4つの間の点線は、はさみで切るときの線。 */
    /* 紙のふちを0にすると、ブラウザが付ける日時・アドレス・ページ番号（ヘッダーとフッター）が出なくなる。 */
    @page { size: A4 portrait; margin: 0; }
    @media print {
      .no-print { display: none; }
      body { max-width: none; margin: 0; padding: 0; }
      #qr-list {
        display: grid;
        grid-template-columns: 10.5cm 10.5cm;
        grid-auto-rows: 14.8cm;
      }
      .qr-card {
        box-sizing: border-box;
        margin: 0;
        padding: 0.8cm 0.6cm;
        border: 1px dashed #b4b2a9;
        border-radius: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .qr-ring { width: 9cm; max-width: 9cm; }   /* QRは約4.5cm角になる */
      .qr-ring .qr-burst { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .qr-card .qr-name { font-size: 1.6rem; margin-top: 0.2cm; }
      .qr-card .qr-points { font-size: 1.1rem; }
      .qr-card .qr-org { font-size: 0.7rem; }
      /* QRの中身のアドレスは、画面で確かめるためのもの。紙には出さない（BUGS.md の B2） */
      .qr-card .qr-url { display: none; }
    }
  </style>
</head>
<body>
  <div class="no-print">
    <p class="org-name">地域連携教育推進センター</p>
    <h1>掲示用QRコード（職員用）</h1>
    <p>rules.js に書いてある「ポイントをもらう」活動のQRコードです。印刷して、活動の場所に貼ってください。</p>
    <p><button type="button" id="print-button">印刷する</button></p>
  </div>

  <div id="qr-list"></div>

  <footer class="credit no-print">制作：yass</footer>

  <script src="rules.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="qr.js"></script>
</body>
</html>
